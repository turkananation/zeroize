name: zeroize
description: >-
  Best-effort secret memory zeroing, constant-time operations, and secure
  containers for pure Dart. No FFI or dart:io required. Designed for
  post-quantum cryptography and security-critical applications.
version: 0.1.0
homepage: https://github.com/turkananation/zeroize
repository: https://github.com/turkananation/zeroize
issue_tracker: https://github.com/turkananation/zeroize/issues

topics:
  - cryptography
  - security
  - memory-safety
  - post-quantum
  - constant-time

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  meta: ^1.10.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
